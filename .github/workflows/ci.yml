name: Validate ContextQuill

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check lib/core.mjs
          node --check mcp/server.mjs
          node --check scripts/store-linkedin-token.mjs
