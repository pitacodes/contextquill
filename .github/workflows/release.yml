name: Publish release archives

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test ContextQuill
        run: npm test

      - name: Build downloadable plugin archives
        run: npm run package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/contextquill-plugin.zip
          dist/contextquill-codex-marketplace.zip
          --verify-tag
          --generate-notes
          --title "ContextQuill $GITHUB_REF_NAME"
